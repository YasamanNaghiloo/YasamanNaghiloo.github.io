<title>Yasaman Naghiloo - Software Engineer</title>
<meta name="description" content="Portfolio of Yasaman Naghiloo, software engineer in Västerås, Sweden, working with test automation, embedded Linux and Python.">

<style>
:root {
  --paper: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #16202B;
  --muted: #566373;
  --line: #D3DAE3;
  --accent: #2457D6;
  --accent-ink: #FFFFFF;
  --signal: #C98A00;
  --display: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --text: 'Newsreader', Georgia, 'Times New Roman', serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F151C;
    --surface: #161E27;
    --ink: #E8EDF3;
    --muted: #9AA7B6;
    --line: #2A3441;
    --accent: #7FA2FF;
    --accent-ink: #0F151C;
    --signal: #F0B429;
  }
}
:root[data-theme="dark"] {
  --paper: #0F151C;
  --surface: #161E27;
  --ink: #E8EDF3;
  --muted: #9AA7B6;
  --line: #2A3441;
  --accent: #7FA2FF;
  --accent-ink: #0F151C;
  --signal: #F0B429;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  min-height: 100%;
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.125rem;
  line-height: 1.65;
  display: flex;
  flex-direction: column;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

.skip {
  position: absolute; left: 1rem; top: -4rem; z-index: 10;
  background: var(--ink); color: var(--paper);
  padding: .6rem 1rem; font-family: var(--display); text-decoration: none;
}
.skip:focus { top: 1rem; }

.wrap { width: 100%; max-width: 70rem; margin: 0 auto; padding: 0 1.5rem; }

/* ---------- header ---------- */
.site-header { padding: 1.25rem 0; border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 2rem; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-decoration: none; letter-spacing: -.01em; }
.nav { display: flex; gap: 1.5rem; font-family: var(--display); font-weight: 500; font-size: 1rem; }
.nav a { text-decoration: none; color: var(--muted); padding: .25rem 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { flex: 1; outline: none; }
main:focus { outline: none; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; letter-spacing: -.02em; margin: 0; }
h1:focus { outline: none; }

/* ---------- hero ---------- */
.hero { padding: clamp(2rem, 6vw, 4.5rem) 0 0; }
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  grid-template-areas: "text photo";
  gap: clamp(1.5rem, 5vw, 4rem);
  align-items: center;
}
.hero-text { grid-area: text; }
.hero-photo { grid-area: photo; justify-self: end; width: 100%; max-width: 20rem; }
.hero h1 { font-size: clamp(2.5rem, 7vw, 4.8rem); font-weight: 700; }
.hero .role { font-family: var(--display); font-weight: 500; font-size: clamp(1.15rem, 2.4vw, 1.5rem); color: var(--muted); margin: 1rem 0 0; letter-spacing: -.01em; }
.hero .intro { max-width: 36rem; margin: 1.5rem 0 0; }
.photo {
  width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 20%;
  border-radius: 6px; background: var(--line);
}
.actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
.btn {
  display: inline-block; font-family: var(--display); font-weight: 600; font-size: 1rem;
  padding: .7rem 1.2rem; border-radius: 4px; text-decoration: none; border: 2px solid var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.secondary:hover { border-color: var(--ink); }
.btn.primary:hover { filter: brightness(1.08); }

/* ---------- waveform ---------- */
.wave { margin-top: clamp(2.5rem, 6vw, 4rem); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wave canvas { display: block; width: 100%; height: 150px; }
.wave-caption {
  display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: center; justify-content: space-between;
  padding: .75rem 0 .9rem; font-family: var(--display); font-size: .95rem; color: var(--muted);
  border-top: 1px solid var(--line);
}
.legend { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
.legend span { display: inline-flex; align-items: center; gap: .5rem; }
.legend i { width: 1.4rem; height: 3px; display: inline-block; border-radius: 2px; }
.legend .ref i { background: var(--accent); }
.legend .dev i { background: var(--signal); }
.readout { font-variant-numeric: tabular-nums; }

/* ---------- sections ---------- */
.section { padding: clamp(2.5rem, 6vw, 4.5rem) 0 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 2rem; margin-bottom: 1.25rem; }
.section-head h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
.section-head a { font-family: var(--display); font-weight: 600; color: var(--accent); }

/* ---------- project rows ---------- */
.rows { border-bottom: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: .25rem 2rem;
  padding: 1.5rem 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit;
}
.row-date { font-family: var(--display); font-weight: 500; color: var(--muted); font-size: 1rem; padding-top: .2rem; }
.row-main { display: block; }
.row-title { display: block; font-family: var(--display); font-weight: 600; font-size: 1.4rem; line-height: 1.2; letter-spacing: -.015em; }
.row:hover .row-title { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.row-desc { display: block; margin-top: .4rem; max-width: 40rem; }
.row-stack { display: block; margin-top: .5rem; font-family: var(--display); font-size: .95rem; color: var(--muted); }

/* ---------- project page ---------- */
.page { padding: clamp(1.75rem, 5vw, 3.5rem) 0 clamp(2.5rem, 6vw, 4.5rem); }
.crumbs { font-family: var(--display); font-size: 1rem; color: var(--muted); margin-bottom: 1.5rem; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--ink); }
.page h1 { font-size: clamp(2rem, 5.2vw, 3.4rem); font-weight: 700; max-width: 20ch; }
.meta { font-family: var(--display); color: var(--muted); margin: 1rem 0 0; font-size: 1.05rem; }
.lead { font-size: 1.35rem; line-height: 1.5; max-width: 40rem; margin: 1.5rem 0 0; }
.project-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: 2rem clamp(2rem, 6vw, 5rem);
  margin-top: 2.5rem; padding-top: 2.5rem; border-top: 1px solid var(--line);
}
.prose { max-width: 38rem; }
.prose h2 { font-size: 1.4rem; margin: 2.25rem 0 .6rem; }
.prose h2:first-child { margin-top: 0; }
.prose p { margin: 0 0 1rem; }
.prose ul { margin: 0 0 1rem; padding-left: 1.2rem; }
.prose li { margin-bottom: .45rem; padding-left: .25rem; }
.prose dl { margin: 0 0 1rem; }
.prose dt { font-family: var(--display); font-weight: 600; margin-top: .75rem; }
.prose dd { margin: 0; }
.aside h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
.aside ul { list-style: none; margin: 0 0 2rem; padding: 0; font-family: var(--display); }
.aside li { padding: .4rem 0; border-top: 1px solid var(--line); }
.aside li:last-child { border-bottom: 1px solid var(--line); }
.aside a { color: var(--accent); font-weight: 600; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3.5rem; border-top: 1px solid var(--line); }
.pager a { display: block; padding: 1.25rem 0; text-decoration: none; }
.pager a:last-child { text-align: right; }
.pager small { display: block; font-family: var(--display); color: var(--muted); font-size: .95rem; }
.pager strong { font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
.pager a:hover strong { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- about / contact ---------- */
.about-grid { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 2rem clamp(2rem, 6vw, 5rem); margin-top: 2rem; align-items: start; }
.about-photo { grid-column: 2; grid-row: 1; }
.about-grid .prose { grid-column: 1; grid-row: 1; max-width: 40rem; }
.timeline { list-style: none; margin: 0 0 1rem; padding: 0; }
.timeline li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: .25rem 1.5rem; padding: 1rem 0; border-top: 1px solid var(--line); margin: 0; }
.timeline li:last-child { border-bottom: 1px solid var(--line); }
.timeline .when { font-family: var(--display); color: var(--muted); font-size: 1rem; }
.timeline strong { font-family: var(--display); font-weight: 600; }
.skills dt { margin-top: 1rem; }
.contact-list { list-style: none; padding: 0; margin: 2rem 0 0; max-width: 34rem; font-family: var(--display); }
.contact-list li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--line); margin: 0; }
.contact-list li:last-child { border-bottom: 1px solid var(--line); }
.contact-list span { color: var(--muted); }
.contact-list a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }

/* ---------- footer ---------- */
.site-footer { border-top: 1px solid var(--line); padding: 1.5rem 0 2rem; font-family: var(--display); font-size: .98rem; color: var(--muted); }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 2rem; }
.site-footer nav { display: flex; gap: 1.25rem; }
.site-footer a { color: var(--muted); }
.site-footer a:hover { color: var(--ink); }

/* ---------- small screens ---------- */
@media (max-width: 52rem) {
  body { font-size: 1.0625rem; }
  .hero-grid { grid-template-columns: 1fr; grid-template-areas: "photo" "text"; }
  .hero-photo { justify-self: start; max-width: 11rem; }
  .row { grid-template-columns: 1fr; }
  .project-grid { grid-template-columns: 1fr; }
  .about-grid { grid-template-columns: 1fr; }
  .about-photo { grid-column: 1; grid-row: 1; max-width: 11rem; }
  .about-grid .prose { grid-row: 2; }
  .timeline li { grid-template-columns: 1fr; }
  .contact-list li { grid-template-columns: 1fr; gap: .1rem; }
  .pager { grid-template-columns: 1fr; }
  .pager a:last-child { text-align: left; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>

function row(p) {
  return `<a class="row" href="#/projects/${p.slug}">

    <span class="row-main">
      <span class="row-title">${p.title}</span>

}

function section(s) {
  let body = '';
  if (s.p) body += s.p.map(t => `<p>${t}</p>`).join('');
  if (s.list) body += `<ul>${s.list.map(t => `<li>${t}</li>`).join('')}</ul>`;
  if (s.dl) body += `<dl>${s.dl.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
  return `<h2>${s.h}</h2>${body}`;
}

/* ------------------------------------------------------------
   Clock-drift illustration (decorative)
------------------------------------------------------------ */
function startWave() {
  const canvas = document.getElementById('wave');
  const readout = document.getElementById('readout');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, raf = 0, lastText = 0;

  function size() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function offsetAt(t) {
    return 1.3 * Math.sin(t * 0.23) * Math.abs(Math.sin(t * 0.37))
         + 0.03 * Math.sin(t * 7.3) + 0.02 * Math.sin(t * 11.1);
  }
  function draw(t) {
    const cs = getComputedStyle(document.documentElement);
    const line = cs.getPropertyValue('--line').trim();
    const ref = cs.getPropertyValue('--accent').trim();
    const dev = cs.getPropertyValue('--signal').trim();
    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 48) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); }
    ctx.moveTo(0, h / 2 + .5); ctx.lineTo(w, h / 2 + .5);
    ctx.stroke();

    const mid = h / 2, amp = h * 0.3;
    const k = (2 * Math.PI) / Math.max(180, w / 4.5);
    const off = offsetAt(t);
    const trace = (phase, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let x = 0; x <= w; x += 2) {
        const y = mid + amp * Math.sin(k * x - t * 1.4 - phase);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    trace(0, ref);
    trace(off, dev);
    return off;
  }
  function frame(ms) {
    if (!canvas.isConnected) { cancelAnimationFrame(raf); return; }
    const t = ms / 1000;
    const off = draw(t);
    if (ms - lastText > 200) {
      const ns = Math.round(off * 40);
      readout.textContent = 'offset ' + (ns > 0 ? '+' : '') + ns + ' ns';
      lastText = ms;
    }
    raf = requestAnimationFrame(frame);
  }
  size();
  new ResizeObserver(() => { size(); if (reduce) draw(1.5); }).observe(canvas);
  if (reduce) { const off = draw(1.5); readout.textContent = 'offset ' + Math.round(off * 40) + ' ns'; }
  else raf = requestAnimationFrame(frame);
}

/* ------------------------------------------------------------
   Router
------------------------------------------------------------ */
function route() {
  const parts = (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean);
  let view;
  if (parts.length === 0) view = viewHome();
  else if (parts[0] === 'projects' && parts.length === 1) view = viewProjects();
  else if (parts[0] === 'projects' && parts.length === 2) view = viewProject(parts[1]);
  else if (parts[0] === 'about') view = viewAbout();
  else if (parts[0] === 'contact') view = viewContact();
  else view = viewNotFound();

  $main.innerHTML = view.html;
  document.title = view.title;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === parts[0]) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  const h1 = $main.querySelector('h1');
  if (h1) h1.focus({ preventScroll: true });
  if (view.after) view.after();
}
window.addEventListener('hashchange', route);
route();
